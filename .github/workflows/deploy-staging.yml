# 스테이징 배포 — 명령어 없이, GitHub에서 돌린다.
#
# 왜 필요한가
#   Cloud Functions는 **Firebase 콘솔에서 배포할 수 없다.** 콘솔의 Functions
#   탭은 이미 배포된 것을 보고·삭제만 한다. 소스를 올리는 버튼이 없다.
#   그래서 콘솔만 쓰는 사람은 로그인 함수를 올릴 방법이 없었다.
#
# 이 워크플로가 그 일을 대신한다. 준비는 한 번만 하면 되고 전부 클릭이다
#   (절차는 STAGING.md 「명령어 없이 배포하기」).
#
# 대상은 **스테이징으로 고정**이다. 이 파일에서 프로덕션을 배포할 수 없다
#   (test/deploy-workflow.test.mjs가 그것을 지킨다).

name: 스테이징 배포

on:
  # GitHub Actions 탭에서 "Run workflow" 버튼으로 실행.
  # (이 버튼은 워크플로 파일이 기본 브랜치에 있을 때 나타난다)
  workflow_dispatch:
    inputs:
      seed:
        description: '테스트 데이터도 넣기 (역할별 계정 4개 + 거래)'
        type: boolean
        default: false
      wipe:
        description: '시드 전에 기존 스테이징 데이터를 지우기'
        type: boolean
        default: false

  # 백엔드에 영향 있는 파일이 바뀌면 자동 배포.
  # 문서만 고쳤을 때는 돌지 않는다.
  #
  # ⚠️ 여기 없는 브랜치는 **백엔드가 배포되지 않는다.** 그런데 Vercel 프리뷰는
  #  public/ 만 올리므로 화면은 최신, Functions·규칙은 옛것인 상태가 된다.
  #    증상: 고친 기능이 프리뷰에서 그대로 안 된다(서버가 옛 코드로 거절).
  #    실제로 codex/** 브랜치에서 "입주자 등록이 안 된다"로 드러났다 —
  #    화면은 새 코드였고 saveClient 는 신규 등록을 막던 옛 코드였다.
  #
  # 이 파일이 main 에 없으면 「Run workflow」 버튼도 안 나타나므로, 패턴에
  # 없는 브랜치는 수동 실행으로도 배포할 수 없다. 작업 브랜치 접두사를
  # 새로 쓰기 시작하면 여기에 추가한다.
  push:
    branches:
      - 'claude/**'
      - 'codex/**'
      - 'fix/staff-single-approval-20261001'
    paths:
      - 'functions/**'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'storage.rules'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-staging.yml'

# 같은 브랜치의 배포가 겹치지 않게 한다 (뒤엣것만 남긴다)
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # 여기가 유일한 대상. 프로덕션은 이 워크플로로 배포하지 않는다.
  FIREBASE_PROJECT: smart-care-ledger-staging

jobs:
  # 시크릿이 없을 때 배포를 "실패"로 끝내면, 준비가 안 됐다는 이유로 PR이 계속
  # 빨간불이 되어 나중에 진짜 실패를 가린다. 그래서 자동 실행(push)은 조용히
  # 건너뛰고, 사람이 직접 누른 실행(workflow_dispatch)만 실패로 알려준다.
  preflight:
    name: 준비 확인
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: 시크릿 확인
        id: check
        env:
          # ⚠️ 시크릿을 run 본문에 ${{ }} 로 박으면 **값이 스크립트 텍스트로 치환된다.**
          # 서비스 계정 JSON에는 큰따옴표와 줄바꿈이 있어 `[ -n "…" ]` 의 인용이
          # 중간에 끊기고 `[: too many arguments` 로 죽는다. `if` 조건의 실패는
          # 무시되므로 **시크릿이 있는데도 "없다"로 판정**되어 배포가 조용히
          # 건너뛰어졌다(실제로 겪은 일이다). env 로 넘기면 값은 셸 변수에만
          # 들어가고 스크립트 문법을 건드리지 않는다.
          SA_JSON: ${{ secrets.FIREBASE_SA_STAGING }}
        run: |
          if [ -n "$SA_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "시크릿 확인됨 · 대상 프로젝트: $FIREBASE_PROJECT"
            exit 0
          fi

          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "## 배포를 건너뛰었습니다"
            echo ""
            echo "\`FIREBASE_SA_STAGING\` 시크릿이 없습니다. 준비는 한 번만 하면 됩니다 —"
            echo "\`STAGING.md\`의 「명령어 없이 배포하기 → 준비」 1~4단계를 보세요."
            echo ""
            echo "1. Google Cloud 콘솔에서 배포용 서비스 계정 만들기 (소유자 역할)"
            echo "2. 키 → JSON 내려받기"
            echo "3. GitHub → Settings → Secrets and variables → Actions →"
            echo "   \`FIREBASE_SA_STAGING\` 으로 JSON 전체 붙여넣기"
            echo "4. Cloud Functions · Cloud Build · Artifact Registry · Cloud Run · Eventarc API 사용 설정"
            echo ""
            echo "시크릿을 넣으면 다음 푸시부터 자동으로 배포됩니다."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 사람이 배포를 기대하고 눌렀다면 조용히 넘기지 않는다
            echo "::error::FIREBASE_SA_STAGING 시크릿이 없습니다. 위 요약의 1~4단계를 먼저 하세요."
            exit 1
          fi
          echo "::warning::FIREBASE_SA_STAGING 시크릿이 없어 배포를 건너뜁니다 (요약 참고)."

  deploy:
    name: Functions · 규칙 · 인덱스
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치 (루트)
        run: npm ci

      - name: 의존성 설치 (functions)
        working-directory: functions
        run: npm ci

      # 매 스텝마다 npx로 내려받지 않도록 한 번만 설치한다
      - name: firebase-tools 설치
        run: npm i -g firebase-tools@15.29.0

      # 깨진 코드를 배포하지 않는다. 여기서 막히면 배포는 시작되지 않는다.
      - name: 검사 (ESLint + 테스트)
        run: npm run check

      - name: 서비스 계정 자격증명 준비
        env:
          SA_JSON: ${{ secrets.FIREBASE_SA_STAGING }}
        run: |
          # 홈 디렉터리에 두고 권한을 좁힌다. 로그에 찍히지 않게 echo하지 않는다.
          printf '%s' "$SA_JSON" > "$HOME/sa.json"
          chmod 600 "$HOME/sa.json"
          # JSON이 맞는지, 어느 프로젝트 키인지 확인 (잘못된 프로젝트 키를 조기에 잡는다)
          KEY_PROJECT=$(node -e "console.log(require(process.env.HOME + '/sa.json').project_id || '')")
          echo "키의 프로젝트: $KEY_PROJECT"
          if [ "$KEY_PROJECT" != "$FIREBASE_PROJECT" ]; then
            echo "::error::시크릿의 서비스 계정 키가 '$KEY_PROJECT' 프로젝트 것입니다."
            echo "::error::'$FIREBASE_PROJECT' 프로젝트에서 새 키를 만들어 시크릿을 교체하세요."
            exit 1
          fi

      # AI(영수증 자동입력)는 **선택 기능**이다 — 키가 없으면 getAiStatus가
      # false를 돌려주고 화면이 버튼을 숨긴다. 그런데 Functions v2는 코드가
      # 선언한 시크릿이 **실재하는지 배포 시점에** 확인하고, 없으면 배포 전체를
      # 멈춘다. 그래서 쓰지도 않는 AI 키 하나 때문에 login·saveClient까지
      # 올라가지 못했다(빈 스테이징 프로젝트에서 실제로 막혔다).
      #
      # 자리만 만들어 둔다. 값은 공백 한 칸이고, isAiConfigured()가 그것을
      # "미설정"으로 본다 — 앱 동작은 키가 없을 때와 완전히 같다.
      # 이미 값이 들어 있으면 건드리지 않는다(진짜 키를 덮어쓰지 않는다).
      - name: AI 시크릿 자리 확인
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          if firebase functions:secrets:access GEMINI_API_KEY \
               --project "$FIREBASE_PROJECT" --non-interactive >/dev/null 2>&1; then
            echo "GEMINI_API_KEY 있음 — 그대로 둡니다."
            exit 0
          fi
          echo "GEMINI_API_KEY 없음 — 빈 자리를 만듭니다 (AI 기능은 꺼진 상태)."
          # 대화형 프롬프트가 뜨면 잡이 타임아웃까지 매달리므로 시간을 끊는다
          printf ' ' | timeout 120 firebase functions:secrets:set GEMINI_API_KEY \
            --project "$FIREBASE_PROJECT" --non-interactive --data-file -

      - name: 배포
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          firebase deploy \
            --only functions,firestore:rules,firestore:indexes,storage \
            --project "$FIREBASE_PROJECT" \
            --non-interactive \
            --force

      - name: 배포된 함수 확인
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          # ⚠️ 예전에는 `firebase functions:list ... | tee /tmp/fns.txt` 였다.
          #    파이프라인의 종료 상태는 **tee 의 것**이라(pipefail 이 없다)
          #    목록 조회가 실패해도 0 으로 넘어가고, 아래 grep 이 빈 파일을 훑어
          #    **「login 함수가 목록에 없습니다」로 잘못 보고했다.**
          #
          #    실제로 그렇게 났다: 같은 잡에서 몇 초 전에
          #    `functions[login] Successful update operation.` 과
          #    `✔ Deploy complete!` 가 찍혔는데도 배포가 반쪽인 것처럼 보였다.
          #    목록을 못 받은 것과 login 이 없는 것은 **원인도 대응도 다르다.**
          list_functions() {
            firebase functions:list \
              --project "$FIREBASE_PROJECT" --non-interactive > /tmp/fns.txt 2>&1
          }
          if ! list_functions; then
            echo "함수 목록 조회가 실패했습니다. 10초 뒤 한 번 더 시도합니다."
            sleep 10
            if ! list_functions; then
              cat /tmp/fns.txt
              echo "::error::함수 목록을 받지 못했습니다 — **배포 실패와는 다릅니다.** 위 배포 단계가 성공했는지 먼저 보세요."
              exit 1
            fi
          fi
          cat /tmp/fns.txt
          # login이 없으면 배포가 반쪽이다 — 조용히 넘기지 않는다
          if ! grep -qi 'login' /tmp/fns.txt; then
            echo "::error::login 함수가 목록에 없습니다. 위 배포 로그를 확인하세요."
            exit 1
          fi

      # 브라우저가 함수를 부를 수 있어야 한다. 막혀 있으면 화면에는 CORS 오류로만
      # 보이므로(원인 찾기 최악) 여기서 확인해 둔다.
      - name: 공개 호출 가능 여부 확인
        run: |
          URL="https://asia-northeast3-$FIREBASE_PROJECT.cloudfunctions.net/login"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS \
            -H 'Origin: https://example.com' \
            -H 'Access-Control-Request-Method: POST' "$URL")
          echo "OPTIONS $URL → $CODE"
          case "$CODE" in
            204|200)
              echo "✅ 브라우저에서 부를 수 있습니다." ;;
            403)
              echo "::error::403 — 함수가 공개 호출 불가 상태입니다."
              echo "::error::Cloud Run → login → 보안 → '인증되지 않은 호출 허용'으로 바꾸세요."
              echo "::error::(STAGING.md 「403일 때」 참고)"
              exit 1 ;;
            404)
              echo "::error::404 — 그 이름·리전에 함수가 없습니다. 위 배포 로그를 확인하세요."
              exit 1 ;;
            *)
              echo "::warning::예상하지 못한 응답($CODE)입니다. 브라우저에서 직접 확인해 보세요." ;;
          esac

      - name: 테스트 데이터 넣기
        if: inputs.seed
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$HOME/sa.json"
          # 스크립트가 프로덕션 프로젝트 ID를 거부한다 (이중 안전장치)
          node tools/seed-staging.mjs --apply \
            --project "$FIREBASE_PROJECT" \
            ${{ inputs.wipe && '--wipe' || '' }}

      - name: 자격증명 삭제
        if: always()
        run: rm -f "$HOME/sa.json"

      - name: 요약
        if: success()
        run: |
          {
            echo "## 스테이징 배포 완료"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| 프로젝트 | \`$FIREBASE_PROJECT\` |"
            echo "| 리전 | \`asia-northeast3\` |"
            echo "| 커밋 | \`${GITHUB_SHA:0:7}\` |"
            echo ""
            echo "### 이제 확인할 것"
            echo "1. 이 브랜치의 Vercel 프리뷰 URL을 엽니다."
            echo "2. 화면 오른쪽 위에 **스테이징** 표시가 뜨는지 봅니다."
            echo "3. 로그인해 봅니다."
            if [ "${{ inputs.seed }}" = "true" ]; then
              echo ""
              echo "테스트 계정: \`center\` · \`leader\` · \`staff\` · \`typist\` (비밀번호 \`staging1234\`)"
            else
              echo ""
              echo "계정이 아직 없으면 로그인 화면에서 **가입**하세요 —"
              echo "\`users\`가 비어 있으면 첫 계정이 관리자로 만들어집니다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
